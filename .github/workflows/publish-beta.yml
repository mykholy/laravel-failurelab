name: Publish verified FailureLab beta

on:
  workflow_run:
    workflows: ["FailureLab standalone CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  beta:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == 'mykholy/laravel-failurelab'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, dom, pdo_sqlite, sqlite3
          tools: composer:v2
      - name: Verify exact release source and API
        run: |
          test -f composer.json && test -f CHANGELOG.md && test -f LICENSE
          composer validate --no-check-publish --strict
          composer require --dev --no-update 'laravel/framework:^13.0' 'orchestra/testbench:^11.0'
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
          vendor/bin/phpunit --configuration phpunit.xml.dist --fail-on-risky
          vendor/bin/pint --test
          composer analyse
          composer audit --locked --no-interaction
          APP_ENV=testing php examples/payment-demo.php
      - name: Publish one immutable prerelease at verified commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag='v0.1.0-beta.1'
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to retag or overwrite it."
            exit 0
          fi
          gh release create "$tag" --target "$VERIFIED_SHA" --title "FailureLab v0.1.0-beta.1" --prerelease --notes "First independent prerelease of Laravel FailureLab. Named in-process fault injection, bounded sequential replay, and explicit recovery assertions. Tested with Laravel 12/13; no real worker crash or exactly-once delivery guarantee."
          gh release view "$tag" --json tagName,isPrerelease,url
      - name: Verify beta tag can be resolved
        run: |
          git ls-remote --tags https://github.com/mykholy/laravel-failurelab.git 'refs/tags/v0.1.0-beta.1' | grep 'refs/tags/v0.1.0-beta.1'
