name: Publish verified stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable SemVer tag (e.g. v1.1.1); never reuse an existing tag'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: failurelab-stable-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify immutable version and exactly current main
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid stable SemVer tag'; exit 1; }
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'main changed since dispatch'; exit 1; }
          grep -Fq "## [${VERSION#v}]" CHANGELOG.md || { echo 'Missing versioned CHANGELOG.md entry'; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo 'Immutable tag already exists: refusing to overwrite'
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists: refusing to overwrite'
            exit 1
          fi
      - name: Require all green upstream checks at the exact release commit
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              '.github/workflows/tests.yml',
              '.github/workflows/vcs-consumer.yml',
              '.github/workflows/packagist-consumers.yml',
              '.github/workflows/tagged-consumer.yml',
              '.github/workflows/packagist-v1-1.yml',
            ];
            const all = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo, head_sha: context.sha, branch: 'main', event: 'push', per_page: 100,
            });
            for (const path of required) {
              const runs = all.filter(run => run.path === path && run.head_sha === context.sha);
              if (runs.length === 0) throw new Error('Missing exact-SHA workflow: ' + path);
              const latest = runs.sort((a, b) => b.id - a.id)[0];
              if (latest.status !== 'completed' || latest.conclusion !== 'success') {
                throw new Error('Release gate not green: ' + path + ' — ' + latest.html_url);
              }
              core.info('Verified ' + path + ' — ' + latest.html_url);
            }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, zip
          tools: composer:v2
          coverage: none
      - name: Create and inspect distribution archive
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish --strict
          mkdir -p dist
          composer archive --format=zip --dir=dist --file=failurelab
          unzip -Z -1 dist/failurelab.zip > dist/files.txt
          grep -Eq '(^|/)composer.json$' dist/files.txt
          if grep -Eq '(^|/)(\.github|tests|\.env)(/|$)' dist/files.txt; then
            echo 'Development files leaked into Composer distribution'
            exit 1
          fi
          (cd dist && sha256sum failurelab.zip > failurelab.sha256)
      - name: Publish new tag and release at verified source SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" dist/failurelab.zip dist/failurelab.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Laravel FailureLab $VERSION" --generate-notes --latest

  packagist:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact-source Packagist indexing
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            curl --fail --silent --show-error --no-cache \
              'https://repo.packagist.org/p2/mykholy/laravel-failurelab.json' > "$RUNNER_TEMP/package.json"
            if jq -e --arg v "$VERSION" --arg sha "$GITHUB_SHA" \
              'any(.packages["mykholy/laravel-failurelab"][]?; (.version == $v or .version == ($v | ltrimstr("v"))) and .source.reference == $sha)' \
              "$RUNNER_TEMP/package.json" >/dev/null; then
              echo 'Packagist indexed exact release source'
              exit 0
            fi
            sleep 15
          done
          echo 'Tag was published, but Packagist indexing was NOT verified'
          exit 1

  public-consumer:
    needs: packagist
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - name: Install exact released version through public registry
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          composer create-project laravel/laravel "$RUNNER_TEMP/consumer" "^${{ matrix.laravel }}" --no-interaction --prefer-dist --no-progress
          cd "$RUNNER_TEMP/consumer"
          php -r '$c=json_decode(file_get_contents("composer.json"),true); if (!empty($c["repositories"])) exit(1);'
          composer require --dev "mykholy/laravel-failurelab:$VERSION" --no-interaction --prefer-dist --no-progress
          composer show mykholy/laravel-failurelab
      - name: Verify discovery and public test APIs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/smoke-release.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getcwd().'/vendor/autoload.php';
          $app = require getcwd().'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $manager = $app->make(\Mykholy\FailureLab\FailureLabManager::class);
          $report = $manager->scenario('public versioned release')
              ->interruptOnceAt('checkout.accepted')->attempts(2)
              ->run(static function ($checkpoint, int $attempt): int {
                  $checkpoint->hit('checkout.accepted');
                  return $attempt;
              });
          $report->assertAttempts(2)->assertFaultPlanSatisfied()->assertCompleted();
          echo "Verified installed release API\n";
          PHP
          APP_ENV=testing php "$RUNNER_TEMP/smoke-release.php"
