name: Render FailureLab WebP README banner

on:
  pull_request:
    paths: [tools/render-readme-hero.py, .github/workflows/render-readme-artwork.yml]
  push:
    branches: [main]
    paths: [tools/render-readme-hero.py, .github/workflows/render-readme-artwork.yml]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image renderer
        run: python -m pip install 'Pillow==11.3.0'
      - name: Render and validate WebP output
        run: python tools/render-readme-hero.py
      - uses: actions/upload-artifact@v4
        with:
          name: failurelab-webp-hero
          path: assets/failurelab-readme-hero.webp
          retention-days: 7

  commit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Add rendered WebP as README hero
        shell: bash
        run: |
          set -euo pipefail
          python tools/render-readme-hero.py
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          hero = '<p align="center"><img src="assets/failurelab-readme-hero.webp" width="1600" alt="Laravel FailureLab: deterministic fault injection, replay and recovery assertions"></p>\n\n'
          if 'assets/failurelab-readme-hero.webp' not in text:
              path.write_text(hero + text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/failurelab-readme-hero.webp
          if git diff --cached --quiet; then
            echo 'No artwork changes to commit'
          else
            git commit -m 'docs: add optimized FailureLab WebP README artwork'
            git push origin HEAD:main
          fi
