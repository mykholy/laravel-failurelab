name: Publish validated FailureLab v1.2.0

on:
  workflow_run:
    workflows: ["FailureLab standalone CI"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: failurelab-v1-2-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'mykholy/laravel-failurelab'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, zip, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - name: Verify exact main SHA and all independent quality gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" = "$VERIFIED_SHA"
          grep -Fq '## [1.2.0]' CHANGELOG.md
          composer validate --strict --no-check-publish
          php tests/smoke.php

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.2.0" >/dev/null 2>&1; then
            echo 'v1.2.0 already exists; refusing to publish twice'
            exit 1
          fi

          required=(tests.yml worker-crash.yml vcs-consumer.yml tagged-consumer.yml packagist-consumers.yml packagist-v1-1.yml)
          for workflow in "${required[@]}"; do
            ok=0
            for attempt in $(seq 1 50); do
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${VERIFIED_SHA}&per_page=100")"
              record="$(printf '%s' "$runs" | jq -r --arg path ".github/workflows/$workflow" '
                [.workflow_runs[] | select(.path == $path and .head_sha == env.VERIFIED_SHA and .event == "push")] |
                sort_by(.id) | last | if . == null then "missing" else (.status + ":" + (.conclusion // "pending")) end
              ')"
              if [[ "$record" == completed:success ]]; then
                ok=1
                break
              fi
              if [[ "$record" == completed:* ]]; then
                echo "Quality gate failed: $workflow ($record)"
                exit 1
              fi
              sleep 8
            done
            [[ "$ok" -eq 1 ]] || { echo "Quality gate never became green: $workflow"; exit 1; }
          done
      - name: Create reproducible Composer distribution artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          composer archive --format=zip --dir=dist --file=failurelab
          unzip -Z -1 dist/failurelab.zip > dist/files.txt
          grep -Eq '(^|/)composer.json$' dist/files.txt
          if grep -Eq '(^|/)(tests|\.github|\.env)(/|$)' dist/files.txt; then
            echo 'Test and repository files leaked into package distribution'
            exit 1
          fi
          (cd dist && sha256sum failurelab.zip > failurelab.sha256)
      - name: Publish stable v1.2.0 once after upstream CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$VERIFIED_SHA"
          gh release create v1.2.0 dist/failurelab.zip dist/failurelab.sha256 \
            --target "$VERIFIED_SHA" --title "FailureLab v1.2.0" --latest \
            --notes "Add a test-only idempotent fake capture provider, synthetic unknown-response/reconciliation scenario and negative controls. Add real disposable Laravel database-queue SIGKILL/recovery CI across Laravel 12/13, developer quick start, recovery recipes and explicit safety boundaries. Public Scenario/Replay APIs remain backward compatible; no real provider, network or production worker is touched."

  registry-consumer:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, zip, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - name: Verify fresh Packagist version and exact source commit
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 35); do
            curl --fail --silent --show-error --header 'Cache-Control: no-cache' \
              'https://repo.packagist.org/p2/mykholy/laravel-failurelab.json' > "$RUNNER_TEMP/package.json"
            if jq -e --arg sha "$VERIFIED_SHA" '
              any(.packages["mykholy/laravel-failurelab"][]?;
                (.version == "v1.2.0" or .version == "1.2.0") and .source.reference == $sha
              )' "$RUNNER_TEMP/package.json" >/dev/null; then ok=1; break; fi
            sleep 8
          done
          [[ "$ok" -eq 1 ]] || { echo 'Packagist did not index v1.2.0 at the verified source'; exit 1; }
      - name: Install v1.2.0 in a clean Laravel ${{ matrix.laravel }} consumer
        run: |
          set -euo pipefail
          composer create-project laravel/laravel "$RUNNER_TEMP/host" "^${{ matrix.laravel }}" --no-interaction --prefer-dist --no-progress
          cd "$RUNNER_TEMP/host"
          php -r '$j=json_decode(file_get_contents("composer.json"), true); if (!empty($j["repositories"])) exit(1);'
          composer require --dev 'mykholy/laravel-failurelab:v1.2.0' --no-interaction --prefer-dist --no-progress
      - name: Verify fake acceptance, lost response and container integration
        working-directory: ${{ runner.temp }}/host
        run: |
          cat > "$RUNNER_TEMP/failurelab-v1-2.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getcwd().'/vendor/autoload.php';
          $app = require getcwd().'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $provider = new \Mykholy\FailureLab\Testing\FakeCaptureGateway;
          try {
              $provider->capture('order-1', loseResponse: true);
              throw new \RuntimeException('Fake did not simulate unknown outcome');
          } catch (\Mykholy\FailureLab\Testing\Exceptions\SimulatedUnknownOutcome) {
              if ($provider->lookup('order-1') === null) throw new \RuntimeException('Missing provider acceptance');
          }
          $provider->capture('order-1');
          if ($provider->acceptedCount() !== 1 || $provider->requestCount() !== 2) {
              throw new \RuntimeException('Idempotent capture invariant failed');
          }
          echo "PASS: v1.2.0 registry fake provider and independent Laravel container\n";
          PHP
          APP_ENV=testing php "$RUNNER_TEMP/failurelab-v1-2.php"
